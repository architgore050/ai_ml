global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: "echoflow-dev"

scrape_configs:
  - job_name: "echoflow-web"
    metrics_path: "/metrics/"
    # The scrape is an internal HTTP hop. Match nginx's proxy contract so
    # Django does not redirect it to TLS on the Gunicorn-only port.
    http_headers:
      X-Forwarded-Proto:
        values: ["https"]
    static_configs:
      # Gunicorn listens on 8000 inside the Compose network. 8005 is only
      # the host-side debug port mapping and is not reachable as web:8005.
      - targets: ["web:8000"]
        labels:
          service: "web"
          tier: "echoflow"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
