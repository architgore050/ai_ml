services:

  db:
    image: pgvector/pgvector:pg16
    container_name: echoflow_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # docker/postgres-init/ runs once on first startup. It:
      #   1. Installs pgvector on template1 (00-init-pgvector.sql) so every
      #      future CREATE DATABASE inherits the vector extension.
      #   2. Provisions an `echoflow_test` database alongside the main
      #      `echoflow_db` (01-echoflow-test-db.sql) for dev environments
      #      that set DATABASE_URL=...echoflow_test in their .env.
      # The separate docker-compose.test.yml still spins up its own
      # echoflow_test container for the pytest suite (in CI / make-test);
      # this main-db provisioning is for `docker compose up` dev only.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
          pids: 500
        reservations:
          cpus: '0.5'
          memory: 512M
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # DECISION: Two Redis instances instead of one. The broker (Celery queues)
  # cannot tolerate message eviction under memory pressure, so it runs with
  # `noeviction`. The cache (Django cache + per-user feed lists + telemetry
  # queue) is safe to evict because refill_user_feed and flush_telemetry are
  # idempotent. Single Redis on localhost remains the non-Docker fallback
  # (see REDIS_URL in settings.py).
  redis_broker:
    image: redis:7-alpine
    container_name: echoflow_redis_broker
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction
    volumes:
      - redis_broker_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
          pids: 300
        reservations:
          cpus: '0.25'
          memory: 128M
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  redis_cache:
    image: redis:7-alpine
    container_name: echoflow_redis_cache
    restart: unless-stopped
    # DECISION: 3GB instead of 1GB. P2.2 pre-computed candidate pools
    # (clip:candidates:exploit + user:{id}:candidates:explore) need
    # ~1.2GB at 10K active users. The remaining ~1.8GB holds the
    # existing per-user feed lists (user_feed:*), Django cache, and
    # telemetry stream. allkeys-lru eviction is safe because the
    # pools can be rebuilt by Beat; if memory pressure forces
    # eviction, the refill_user_feed SQL fallback kicks in.
    command: redis-server --appendonly yes --maxmemory 3gb --maxmemory-policy allkeys-lru
    volumes:
      - redis_cache_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
          pids: 300
        reservations:
          cpus: '0.25'
          memory: 256M
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # DECISION: PgBouncer in front of db. transaction pool mode multiplexes
  # hundreds of Django + Celery client connections onto ~25 real Postgres
  # connections, so `max_connections` doesn't exhaust at 10K concurrent.
  # AUTH_TYPE=scram-sha-256 — same wire auth as direct Postgres, no
  # plaintext trust mode. Uses edoburu/pgbouncer (upstream 1.x base is
  # EOL Alpine 3.9; see docker/pgbouncer/Dockerfile SECURITY note).
  # Profile: only built/started when explicitly requested (not in test stack).
  pgbouncer:
    #profiles: ["production"]
    build:
      context: ./docker/pgbouncer
      dockerfile: Dockerfile
    image: echoflow/pgbouncer:local
    container_name: echoflow_pgbouncer
    restart: unless-stopped
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - LISTEN_PORT=6432
      - AUTH_TYPE=scram-sha-256
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=10000
      - DEFAULT_POOL_SIZE=25
      - MIN_POOL_SIZE=5
      - RESERVE_POOL_SIZE=5
      - RESERVE_POOL_TIMEOUT=3
      - SERVER_IDLE_TIMEOUT=600
      - QUERY_WAIT_TIMEOUT=120
      - VERBOSE=0
      - LOG_CONNECTIONS=1
      # SECURITY: allow clients to pass these GUCs through pgbouncer
      # without pgbouncer rejecting them as "unsupported startup
      # parameter in options". The Django app sets them in
      # `OPTIONS['options']` of the psycopg2 connection so every new
      # transaction starts with the same timeouts (statement_timeout
      # = 30s, lock_timeout = 10s, idle_in_transaction_session_
      # timeout = 60s) regardless of which pooled backend connection
      # pgbouncer hands out. Without this list, pgbouncer refuses
      # the connection at startup with
      #   FATAL: unsupported startup parameter in options: statement_timeout
      # and every web/celery container crashes before its first query.
      # pgbouncer does NOT apply these settings itself — it only
      # ignores the unknown name so the client request can pass
      # through to Postgres, which honors the `-c` prefix.
      - IGNORE_STARTUP_PARAMETERS=extra_float_digits,statement_timeout,idle_in_transaction_session_timeout,lock_timeout,connect_timeout,default_transaction_read_only
      - LOG_DISCONNECTIONS=1
      - LOG_POOLER_ERRORS=1
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "6432:6432"
    healthcheck:
      # DECISION: psql probe as the real app user (not pg_isready or a bare
      # TCP probe). `pg_isready` runs as the container's default user
      # (`postgres`), but pgbouncer's userlist only contains ${DB_USER};
      # AUTH_TYPE=scram-sha-256 then rejects the probe with
      # `no such user: postgres`. BusyBox `nc -z` returns exit 1 even
      # when the port IS open (verified: silent failure on closed
      # connection). A psql `SELECT 1` against pgbouncer as ${DB_USER}
      # with ${DB_PASSWORD} exercises the full SCRAM auth path AND the
      # upstream Postgres round-trip — a stronger guarantee than a TCP
      # check — at the cost of one tiny query every 10s. Acceptable.
      test: ["CMD-SHELL", "PGPASSWORD=$DB_PASSWORD psql -h 127.0.0.1 -p 6432 -U $DB_USER -d $DB_NAME -c 'SELECT 1' -t -A -q >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
          pids: 500
        reservations:
          cpus: '0.1'
          memory: 64M
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # Local, S3-API-compatible object storage — the dev-parity equivalent of
  # real S3/R2. Every app container reaches this the exact same way it would
  # reach real S3 in prod: over the network, via AWS_S3_ENDPOINT_URL, with no
  # shared filesystem. This is what makes the "works locally, breaks in
  # prod" class of bug from earlier this week structurally impossible now —
  # local dev IS a disconnected-storage topology, not an approximation of one.
  minio:
    image: quay.io/minio/minio:latest
    container_name: echoflow_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      # SECURITY: fail-loud if AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
      # are unset. Previously these fell back to dev defaults
      # (`echoflow-dev` / `echoflow-dev-secret`), so a missing .env
      # silently left object storage behind a publicly-known password
      # with no startup failure. Same pattern as GRAFANA_ADMIN_PASSWORD
      # (line 654 below). Local dev .env files already set both vars;
      # operators who copy compose for prod must set real values.
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID is required}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY is required}
      # CORS for browser-based HLS playback (hls.js loads segments from MinIO)
      MINIO_CORS_ALLOW_ORIGIN: "*"
      MINIO_CORS_ALLOW_METHODS: "GET,PUT,POST,DELETE,OPTIONS"
      MINIO_CORS_ALLOW_HEADERS: "Origin,Accept,Content-Type,Authorization,Range"
      MINIO_CORS_EXPOSE_HEADERS: "Date,Content-Length,Content-Range,Accept-Ranges"
      MINIO_CORS_MAX_AGE: "3600"
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # One-shot: creates the bucket on startup so `web`/`celery_media` never
  # race against an empty MinIO on first boot. Exits after running; not a
  # long-lived service.
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
        mc alias set local http://minio:9000 ${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID is required} ${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY is required} &&
         mc mb --ignore-existing local/${AWS_STORAGE_BUCKET_NAME:-echoflow-media}
         # NOTE: hls/ is intentionally NOT made public (mc anonymous set download
         # is omitted). HLS token protection is handled by the Cloudflare Worker
         # (production, see docs/EXPLAIN/storage/04-hls-token-protection.md) or
         # nginx njs (dev, see Option B in the same doc). The hls/ prefix
         # stays private; token validation happens before proxy_pass to MinIO.
       "
    # DIAGNOSIS: HLS is a multi-file protocol — master.m3u8 references variant
    # playlists and those reference segment files, all via RELATIVE paths.
    # A presigned URL's signature is a query string, and per RFC 3986,
    # resolving a relative reference against a base URL does NOT carry the
    # base's query string forward. So even a fully-signed master.m3u8 request
    # succeeds while every file IT references gets requested with no
    # signature at all — a 403 against a private bucket. One signed URL
    # cannot authorize a stream made of dozens of objects.
    #
    # HLS TOKEN PROTECTION: The fix is signed COOKIES, not signed URLs.
    # A cookie scoped to Path=/hls/ is sent by the browser on ALL subrequests
    # (master.m3u8, variants, segments) without RFC 3986 query-string stripping.
    # The cookie is issued by Django (GET /api/v1/media/playback-token/<clip_id>/)
    # and validated by:
    #   - Cloudflare Worker (production): workers/hls-token-worker/
    #   - nginx njs module (dev): docker/nginx/hls_auth.js
    # See docs/EXPLAIN/storage/04-hls-token-protection.md for full design.
    # The fix used everywhere in real HLS-over-S3 deployments (Netflix,
    # Spotify, etc., minus the CDN): the RENDERED stream is public-read; the
    # ORIGINAL uploaded file — the one thing actually worth protecting —
    # stays private. `mc anonymous set download` here scopes that to the
    # `hls/` prefix only; `uploads/` (originals) keeps default private ACLs
    # and still requires the signed URLs from media_urls.py.

  web:
    image: devansh1012007/echoflow-api:${TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    #container_name: echoflow_web
    working_dir: /app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - REDIS_BROKER_URL=${REDIS_BROKER_URL:-redis://redis_broker:6379/0}
      - REDIS_CACHE_URL=${REDIS_CACHE_URL:-redis://redis_cache:6379/0}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-False}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-localhost}
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-4}
      - GUNICORN_THREADS=${GUNICORN_THREADS:-4}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID is required}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY is required}
      - AWS_STORAGE_BUCKET_NAME=${AWS_STORAGE_BUCKET_NAME:-echoflow-media}
      - AWS_S3_ENDPOINT_URL=${AWS_S3_ENDPOINT_URL:-http://minio:9000}
      - AWS_S3_REGION_NAME=${AWS_S3_REGION_NAME:-auto}
      - AWS_S3_QUERYSTRING_EXPIRE=${AWS_S3_QUERYSTRING_EXPIRE:-3600}
      - PUBLIC_MEDIA_ENDPOINT_URL=${PUBLIC_MEDIA_ENDPOINT_URL:-http://localhost:9000}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENV=${SENTRY_ENV:-production}
      - SENTRY_TRACES_SAMPLE_RATE=${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      - SENTRY_PROFILES_SAMPLE_RATE=${SENTRY_PROFILES_SAMPLE_RATE:-0.05}
    command: >
      sh -c "set -e && python wait_for_db.py &&
         python manage.py migrate &&
         python manage.py collectstatic --noinput &&
         gunicorn -c gunicorn.conf.py backend.EchoFlow.wsgi:application"
    volumes:
      - .:/app
    ports:
      - "8005:8000"
    depends_on:
      db:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis_broker:
        condition: service_healthy
      redis_cache:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      # SECURITY: with SECURE_SSL_REDIRECT=True in production, an
      # in-container http://.../health/ request would 301 to https://
      # ... and (because urllib follows redirects) would appear healthy
      # even if the app was broken. Send X-Forwarded-Proto: https
      # so the probe exercises the real production request path.
      test: ["CMD", "python", "-c", "import urllib.request; req = urllib.request.Request('http://localhost:8000/health/', headers={'X-Forwarded-Proto': 'https'}); urllib.request.urlopen(req, timeout=4)"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
          pids: 500
        reservations:
          cpus: '0.5'
          memory: 256M
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  celery:
    image: devansh1012007/echoflow-api:${TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    #container_name: echoflow_worker
    working_dir: /app
    user: "1000:1000"
    env_file:
      - .env
    restart: unless-stopped
    command: >
      sh -c "set -e && python wait_for_db.py &&
              celery -A backend.EchoFlow worker --loglevel=info"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis_broker:
        condition: service_healthy
      redis_cache:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    # This image is shared with web, whose baked HTTP probe would misfire
    # here — override with a Celery-ping of this node.
    healthcheck:
      test: ["CMD-SHELL", "celery -A backend.EchoFlow inspect ping -d \"celery@$$(hostname)\" --timeout=10 || exit 1"]
      interval: 30s
      timeout: 15s
      start_period: 30s
      retries: 3
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - REDIS_BROKER_URL=${REDIS_BROKER_URL:-redis://redis_broker:6379/0}
      - REDIS_CACHE_URL=${REDIS_CACHE_URL:-redis://redis_cache:6379/0}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-False}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENV=${SENTRY_ENV:-production}
      - SENTRY_TRACES_SAMPLE_RATE=${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      - SENTRY_PROFILES_SAMPLE_RATE=${SENTRY_PROFILES_SAMPLE_RATE:-0.05}
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
          pids: 300
        reservations:
          cpus: '0.25'
          memory: 256M
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  celery_feed:
    image: devansh1012007/echoflow-api:${TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    #container_name: echoflow_feed_worker
    restart: unless-stopped
    command: >
      sh -c "set -e && python wait_for_db.py &&
              celery -A backend.EchoFlow worker -Q fast_feed --concurrency=4 --loglevel=info"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis_broker:
        condition: service_healthy
      redis_cache:
        condition: service_healthy
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - REDIS_BROKER_URL=${REDIS_BROKER_URL:-redis://redis_broker:6379/0}
      - REDIS_CACHE_URL=${REDIS_CACHE_URL:-redis://redis_cache:6379/0}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-False}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENV=${SENTRY_ENV:-production}
      - SENTRY_TRACES_SAMPLE_RATE=${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      - SENTRY_PROFILES_SAMPLE_RATE=${SENTRY_PROFILES_SAMPLE_RATE:-0.05}
    volumes:
      - .:/app
    # Same shared-image override as the default celery worker.
    healthcheck:
      test: ["CMD-SHELL", "celery -A backend.EchoFlow inspect ping -d \"celery@$$(hostname)\" --timeout=10 || exit 1"]
      interval: 30s
      timeout: 15s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
          pids: 300
        reservations:
          cpus: '0.25'
          memory: 256M
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  celery_media:
    image: devansh1012007/echoflow-media:${TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: media
      # HF_TOKEN is forwarded to the build as a BuildKit SECRET (never ARG),
      # sourced from the HF_TOKEN variable in .env via the top-level secrets
      # block below.
      secrets:
        - hf_token
    #container_name: echoflow_media_worker
    restart: unless-stopped
    command: >
      sh -c "set -e && python wait_for_db.py &&
              # DECISION: prefork concurrency=2 instead of solo. Each worker
              # loads Whisper (~1.5GB) + SentenceTransformer (~0.5GB) = ~2GB
              # resident. 2 workers × 2GB = 4GB fits the 4G memory limit.
              # Concurrency > 2 risks OOMKill under concurrent clip uploads.
              # Raise both this flag AND the memory limit together when the
              # worker moves to a node with more RAM.
              celery -A backend.EchoFlow worker -Q heavy_media --pool=prefork --concurrency=2 --loglevel=info"
    # No volumes at all now — this worker never needed local disk for
    # anything but media, and media is object storage now. That's the whole
    # point: this container can run on any machine, with no filesystem in
    # common with `web`, and still process clips correctly.
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis_broker:
        condition: service_healthy
      redis_cache:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - REDIS_BROKER_URL=${REDIS_BROKER_URL:-redis://redis_broker:6379/0}
      - REDIS_CACHE_URL=${REDIS_CACHE_URL:-redis://redis_cache:6379/0}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-False}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENV=${SENTRY_ENV:-production}
      - SENTRY_TRACES_SAMPLE_RATE=${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      - SENTRY_PROFILES_SAMPLE_RATE=${SENTRY_PROFILES_SAMPLE_RATE:-0.05}
      # Must match the bake-time path in the Dockerfile (models are baked in,
      # NOT downloaded at runtime). Do NOT mount a cache volume over it.
      - HF_HOME=/home/appuser/.cache/huggingface
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
    deploy:
      resources:
        limits:
          cpus: '4'
          # DECISION: 4 GB is the floor for Whisper base + SentenceTransformer
          # + KeyBERT resident. 1 GB was OOMKill-ing on the first clip.
          # Raise further if processing longer clips or running concurrently.
          memory: 4G
          pids: 200
        reservations:
          cpus: '2'
          memory: 2G
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    image: devansh1012007/echoflow-api:${TAG:-latest}
    #container_name: echoflow_celery_beat
    restart: unless-stopped
    working_dir: /app
    user: "1000:1000"
    command: >
      sh -c "set -e && python wait_for_db.py &&
              celery -A backend.EchoFlow beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler"
    # NOTE: omitting `healthcheck:` here does NOT disable Docker's healthcheck —
    # it means Compose falls back to the one baked into the image via the
    # Dockerfile's HEALTHCHECK instruction. Since this service builds
    # `target: api`, it inherits the api-stage check:
    #   urllib.request.urlopen('http://localhost:8000/health/')
    # but `celery beat` never runs gunicorn and never listens on :8000, so
    # that probe fails every single interval regardless of whether beat is
    # actually healthy. Explicitly disable it instead — beat genuinely has
    # no meaningful in-container probe (it never answers `celery inspect
    # ping`), so liveness is restart: unless-stopped + process supervision.
    healthcheck:
      disable: true
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis_broker:
        condition: service_healthy
      redis_cache:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - REDIS_BROKER_URL=${REDIS_BROKER_URL:-redis://redis_broker:6379/0}
      - REDIS_CACHE_URL=${REDIS_CACHE_URL:-redis://redis_cache:6379/0}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-False}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENV=${SENTRY_ENV:-production}
      - SENTRY_TRACES_SAMPLE_RATE=${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      - SENTRY_PROFILES_SAMPLE_RATE=${SENTRY_PROFILES_SAMPLE_RATE:-0.05}
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
          pids: 200
        reservations:
          cpus: '0.1'
          memory: 128M
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # DECISION: nginx as the only public-facing entrypoint. Listens on :80
  # (HTTP, redirects to HTTPS), :443 (Django API over TLS) and :9443
  # (MinIO over TLS so browsers can fetch HLS segments without mixed-content
  # blocks). Internal hops — gunicorn→nginx, nginx→minio — stay on plain
  # HTTP over the docker network; TLS is terminated once at the edge.
  #
  # HLS TOKEN PROTECTION (dev parity): In production, HLS token validation
  # happens at the Cloudflare Worker edge (media.echo-flow.in → Worker → R2).
  # In dev, the :9443 nginx server block validates HLS tokens via the njs
  # module (docker/nginx/hls_auth.js) before proxying to MinIO. Both layers
  # validate the same ef_hls_token HMAC cookie issued by Django.
  # See docs/EXPLAIN/storage/04-hls-token-protection.md for design.
  #
  # The cert + key are bind-mounted from ./docker/certs/ (self-signed for
  # dev; replace with Let's Encrypt fullchain + privkey in prod). No cert
  # material enters the application image, so renewal never requires a
  # web-container rebuild.
  nginx:
    image: nginx:1.27-alpine
    # DECISION: Install nginx-mod-njs for HLS token cookie validation (dev
    # parity with the Cloudflare Worker). In dev only, the :9443 server block
    # uses js_access to validate the ef_hls_token cookie before proxying to
    # MinIO. Production uses the Cloudflare Worker instead.
    # NOTE: This line is applied via docker-compose override or image rebuild;
    # see docs/EXPLAIN/storage/04-hls-token-protection.md#option-b--nginx--njs-development
    container_name: echoflow_nginx
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "9443:9443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/certs:/etc/nginx/certs:ro
      # njs script for HLS token cookie validation (dev parity with Worker)
      - ./docker/nginx/hls_auth.js:/etc/nginx/hls_auth.js:ro
    healthcheck:
      # wget is shipped in nginx:alpine; -q silences the success path,
      # --spider does a HEAD so we don't transfer a body. The 301-to-HTTPS
      # redirect is the expected response on :80 and verifies TLS is
      # functional end-to-end.
      test: ["CMD", "wget", "-q", "--spider", "https://localhost/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
          pids: 100
        reservations:
          cpus: '0.1'
          memory: 32M
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # DECISION: Prometheus scrapes /metrics/ from the web container every
  # 15s. web:8005 is the in-container gunicorn port (the same port the
  # debug-escape host port 8005 maps to). 15s is the smallest scrape
  # interval that doesn't dominate disk I/O at 7-day retention. Retention
  # is the prometheus default (15 days) — production should override with
  # --storage.tsdb.retention.time=30d and provision more disk.
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: echoflow_prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
          pids: 200
        reservations:
          cpus: '0.1'
          memory: 128M
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # DECISION: Grafana reads Prometheus via the auto-provisioned
  # datasource and loads dashboards from /var/lib/grafana/dashboards
  # (mounted from docker/grafana/dashboards). GF_SECURITY_ADMIN_PASSWORD
  # has no default fallback — Grafana itself rejects a missing admin
  # password in v11.x, which is fail-loud (better than shipping a
  # well-known admin/admin).
  grafana:
    image: grafana/grafana:11.2.0
    container_name: echoflow_grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
          pids: 200
        reservations:
          cpus: '0.1'
          memory: 128M
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

# Define persistent storage
volumes:
  postgres_data:
  redis_broker_data:
  redis_cache_data:
  minio_data:  # MinIO's own storage — belongs to the minio service alone,
    # never mounted into web/celery/celery_media. App containers reach it
    # over the network (S3 API) exactly like they'd reach real S3 in prod;
    # there is no separate "local mode" volume-sharing code path anymore.
  prometheus_data:  # Prometheus TSDB storage. ~50 GB worst-case at 15s
    # scrape × 7-day retention × ~150 active series. Dev-tier fine.
  grafana_data:  # Grafana's own storage (users, dashboards metadata, sqlite).
    # The JSON dashboards themselves are bind-mounted from
    # docker/grafana/dashboards, so this volume only holds user-managed
    # state.

# Build-time secrets (Compose >= 2.17 forwards these to BuildKit).
# hf_token is consumed by the Dockerfile's --mount=type=secret,id=hf_token
# during the HuggingFace model bake; it never becomes ARG/ENV/layer data.
secrets:
  hf_token:
    environment: HF_TOKEN

    