# EchoFlow — nginx TLS terminator + reverse proxy (LOCAL DEV VERSION)
#
# This is a copy of docker/nginx.conf with upstream hostnames changed for
# the local dev stack (web_local, minio_local instead of web, minio).

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # --- Basic hardening ---------------------------------------------------
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;
    client_max_body_size 100m;

    # --- Logging -----------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # --- Upstreams ---------------------------------------------------------
    upstream django_backend {
        server web_local:8000;
        keepalive 32;
    }

    upstream minio_backend {
        server minio_local:9000;
        keepalive 32;
    }

    # --- HTTP :80  →  HTTPS :443 redirect ----------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --- HTTPS :443  →  Django ---------------------------------------------
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/localhost.crt;
        ssl_certificate_key /etc/nginx/certs/localhost.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        
        location ~* /\.env {
            deny all;
            return 404;
        }
        
        location ~* \.env(\.|$) {
            deny all;
            return 404;
        }
        
        location ~* /(config|app|application|backend|src|static|media)/\.env {
            deny all;
            return 404;
        }
        
        location ~* /\.(git|svn|hg|bzr) {
            deny all;
            return 404;
        }
        
        location ~* \.(bak|old|orig|save|swp|tmp|sql|dump)$ {
            deny all;
            return 404;
        }

        location / {
            proxy_pass http://django_backend;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Port  443;

            proxy_connect_timeout 5s;
            proxy_send_timeout    130s;
            proxy_read_timeout    130s;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }

    # --- HTTPS :9443  →  MinIO (browser HLS playback) ----------------------
    server {
        listen 9443 ssl;
        listen [::]:9443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/localhost.crt;
        ssl_certificate_key /etc/nginx/certs/localhost.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        proxy_buffering off;
        proxy_request_buffering off;

        location / {
            proxy_pass http://minio_backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}