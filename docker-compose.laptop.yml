# =============================================================================
# EchoFlow — Laptop Media Worker Compose
#
# Runs ONLY the heavy media worker (celery_media) on the laptop.
# Connects to VPS services (PostgreSQL, Redis, R2) via Tailscale private network.
#
# Prerequisites:
#   1. Tailscale subnet router running on VPS (172.28.0.0/16 advertised)
#   2. .env copied from .env.laptop.example with real values
#   3. Media image built: docker build --target media -t echoflow-media:local --secret id=hf_token,env=HF_TOKEN .
#
# Usage:
#   docker compose -f docker-compose.laptop.yml up -d
#
# DATABASE_URL is BUILT from DB_USER/DB_PASSWORD/DB_HOST/DB_PORT/DB_NAME, not
# passed through from .env.laptop. It used to be `- DATABASE_URL=${DATABASE_URL}`,
# which required the operator to hand-maintain a full URL containing the VPS
# database password *in addition to* the DB_PASSWORD value — two copies that
# could diverge silently. docker compose does not expand ${...} inside an env
# file, so the URL must be assembled here, in `environment:`.
# =============================================================================

services:
  celery_media:
    image: echoflow-media:${TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      target: media
    restart: unless-stopped
    command: >
      sh -c "set -e && python wait_for_db.py &&
              celery -A backend.EchoFlow worker -Q heavy_media --pool=prefork --concurrency=2 --loglevel=info"
    env_file:
      - .env.laptop
    volumes:
      - laptop-scratch:/tmp
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '2'
          memory: 2G
    environment:
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
      - REDIS_BROKER_URL=${REDIS_BROKER_URL}
      - REDIS_CACHE_URL=${REDIS_CACHE_URL}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-False}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-api.echoflow.in}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_STORAGE_BUCKET_NAME=${AWS_STORAGE_BUCKET_NAME:-echoflow-media}
      - AWS_S3_ENDPOINT_URL=${AWS_S3_ENDPOINT_URL}
      - AWS_S3_REGION_NAME=${AWS_S3_REGION_NAME:-auto}
      - AWS_S3_QUERYSTRING_EXPIRE=${AWS_S3_QUERYSTRING_EXPIRE:-3600}
      - PUBLIC_MEDIA_ENDPOINT_URL=${PUBLIC_MEDIA_ENDPOINT_URL:-https://media.echoflow.in}
      - HF_HOME=/home/appuser/.cache/huggingface
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENV=${SENTRY_ENV:-production}

volumes:
  laptop-scratch:
